name: Deploy

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full Git SHA to verify and deploy
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.revision }}
      - run: test "$(git rev-parse HEAD)" = "$REVISION"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: bash -n deploy/deploy.sh
      - run: >-
          TIDEO_SOURCE_ROOT=.
          TIDEO_ENV_FILE=deploy/.env.example
          docker compose
          --env-file deploy/.env.example
          --project-directory .
          -f deploy/compose.production.yaml
          config --quiet
      - run: >-
          TIDEO_SOURCE_ROOT=.
          TIDEO_ENV_FILE=deploy/.env.example
          TIDEO_IMAGE_TAG=$REVISION
          docker compose
          --env-file deploy/.env.example
          --project-directory .
          -f deploy/compose.production.yaml
          build api worker-heavy

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      REVISION: ${{ inputs.revision }}
      VPS_HOST: ${{ vars.CONTABO_VPS_HOST }}
      VPS_USER: ${{ vars.CONTABO_VPS_USER }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.revision }}
      - name: Configure deployment SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.CONTABO_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.CONTABO_VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/tideo_deploy
          chmod 600 ~/.ssh/tideo_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload deployment command
        run: |
          scp -i ~/.ssh/tideo_deploy \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            deploy/deploy.sh \
            "$VPS_USER@$VPS_HOST:/opt/workspace/apps/tideo/deploy.next"
      - name: Deploy verified revision
        run: |
          ssh -i ~/.ssh/tideo_deploy \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST" \
            "chmod 0755 /opt/workspace/apps/tideo/deploy.next &&
             mv /opt/workspace/apps/tideo/deploy.next /opt/workspace/apps/tideo/deploy &&
             exec /opt/workspace/apps/tideo/deploy $REVISION"
