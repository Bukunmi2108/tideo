name: Deploy

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full Git SHA to verify and deploy
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.revision }}
      - run: test "$(git rev-parse HEAD)" = "$REVISION"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: bash -n deploy/deploy.sh
      - run: >-
          TIDEO_SOURCE_ROOT=.
          TIDEO_ENV_FILE=deploy/.env.example
          docker compose
          --env-file deploy/.env.example
          --project-directory .
          -f deploy/compose.production.yaml
          config --quiet

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      REVISION: ${{ inputs.revision }}
      VPS_HOST: ${{ vars.CONTABO_VPS_HOST }}
      VPS_USER: ${{ vars.CONTABO_VPS_USER }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.revision }}
      - name: Configure deployment SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.CONTABO_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.CONTABO_VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/tideo_deploy
          chmod 600 ~/.ssh/tideo_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload deployment command
        run: |
          scp -i ~/.ssh/tideo_deploy \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            deploy/deploy.sh \
            "$VPS_USER@$VPS_HOST:/opt/workspace/apps/tideo/deploy.next"
      - name: Deploy verified revision
        run: |
          ssh -i ~/.ssh/tideo_deploy \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST" \
            "chmod 0755 /opt/workspace/apps/tideo/deploy.next &&
             mv /opt/workspace/apps/tideo/deploy.next /opt/workspace/apps/tideo/deploy &&
             exec /opt/workspace/apps/tideo/deploy $REVISION"
